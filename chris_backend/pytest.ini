[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: mark test as an async test
    integration: mark test as an integration test
    unit: mark test as a unit test
